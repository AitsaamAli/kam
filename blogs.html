<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Latest insights on tax, regulatory compliance, and business strategy from Kamboh Associates."/>
<meta name="keywords" content="tax blog, regulatory compliance, Pakistan business insights"/>
<meta name="og:title" content="Blog - Kamboh Associates"/>
<meta name="og:description" content="Expert tax and regulatory insights"/>
<meta name="og:type" content="website"/>
<title>Blog - Kamboh Associates — Tax & Regulatory Excellence in Pakistan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
  --gold:        #B8860B;
  --gold-light:  #D4AF37;
  --gold-dim:    #8B6914;
  --gold-pale:   #FDF6E3;
  --amber:       #D97706;
  --blue:        #1E40AF;
  --blue-mid:    #2563EB;
  --blue-light:  #3B82F6;
  --green:       #059669;
  --red:         #DC2626;
  --font-display: 'Cinzel', serif;
  --font-serif:   'Cormorant Garamond', Georgia, serif;
  --font-body:    'DM Sans', system-ui, sans-serif;
  --max-w: 1200px;
  --ease: cubic-bezier(0.4,0,0.2,1);
}

[data-theme="light"] {
  --bg:          #FFFFFF;
  --bg-2:        #F8F9FA;
  --bg-3:        #F1F3F5;
  --surface:     #FFFFFF;
  --surface-2:   #F8F9FA;
  --border:      #E2E8F0;
  --text:        #0F172A;
  --text-2:      #334155;
  --text-3:      #64748B;
}

[data-theme="dark"] {
  --bg:          #0F172A;
  --bg-2:        #1E293B;
  --bg-3:        #334155;
  --surface:     #1E293B;
  --surface-2:   #334155;
  --border:      #475569;
  --text:        #F1F5F9;
  --text-2:      #CBD5E1;
  --text-3:      #94A3B8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.6;
  transition: background-color 0.3s, color 0.3s;
}

/* ═══════ NAVIGATION ═══════ */
nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 1rem 2rem;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-container {
  max-width: var(--max-w);
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--gold);
  text-decoration: none;
}
.nav-links {
  display: flex;
  gap: 2rem;
  list-style: none;
}
.nav-links a {
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s;
}
.nav-links a:hover { color: var(--gold); }

/* ═══════ HERO ═══════ */
.hero {
  background: linear-gradient(135deg, var(--gold-pale), var(--surface-2));
  padding: 4rem 2rem;
  text-align: center;
}
.hero h1 {
  font-family: var(--font-display);
  font-size: 3rem;
  color: var(--gold);
  margin-bottom: 1rem;
}
.hero p {
  font-size: 1.2rem;
  color: var(--text-2);
  max-width: 600px;
  margin: 0 auto;
}

/* ═══════ BLOG GRID ═══════ */
.container { max-width: var(--max-w); margin: 0 auto; padding: 3rem 2rem; }
.blog-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 2rem;
  margin: 2rem 0;
}
.blog-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: all 0.3s;
  cursor: pointer;
  display: flex;
  flex-direction: column;
}
.blog-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 24px rgba(184,134,11,0.15);
  border-color: var(--gold);
}
.blog-card-image {
  width: 100%;
  height: 200px;
  background: linear-gradient(135deg, var(--gold-pale), var(--bg-3));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  color: var(--gold-dim);
}
.blog-card-content {
  padding: 1.5rem;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
}
.blog-category {
  display: inline-block;
  background: rgba(184,134,11,0.1);
  color: var(--gold);
  padding: 0.4rem 0.8rem;
  border-radius: 4px;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  width: fit-content;
}
.blog-title {
  font-family: var(--font-serif);
  font-size: 1.3rem;
  color: var(--text);
  margin-bottom: 0.5rem;
  line-height: 1.4;
}
.blog-excerpt {
  color: var(--text-3);
  font-size: 0.95rem;
  margin-bottom: 1rem;
  flex-grow: 1;
}
.blog-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text-3);
  font-size: 0.85rem;
  border-top: 1px solid var(--border);
  padding-top: 1rem;
}
.blog-date { display: flex; align-items: center; gap: 0.5rem; }
.read-time { display: flex; align-items: center; gap: 0.5rem; }

/* ═══════ BLOG POST PAGE ═══════ */
.blog-post {
  max-width: 800px;
  margin: 0 auto;
  padding: 3rem 2rem;
}
.post-header {
  margin-bottom: 2rem;
  border-bottom: 2px solid var(--gold);
  padding-bottom: 2rem;
}
.post-title {
  font-family: var(--font-display);
  font-size: 2.5rem;
  color: var(--gold);
  margin-bottom: 1rem;
}
.post-meta {
  display: flex;
  gap: 2rem;
  color: var(--text-3);
  margin-bottom: 1rem;
}
.post-meta span {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.post-content {
  line-height: 1.8;
  color: var(--text-2);
}
.post-content h2 {
  font-family: var(--font-serif);
  font-size: 1.8rem;
  color: var(--gold);
  margin: 2rem 0 1rem 0;
}
.post-content h3 {
  font-family: var(--font-serif);
  font-size: 1.3rem;
  color: var(--text);
  margin: 1.5rem 0 0.5rem 0;
}
.post-content p {
  margin-bottom: 1rem;
}
.post-content ul, .post-content ol {
  margin-left: 2rem;
  margin-bottom: 1rem;
}
.post-content li {
  margin-bottom: 0.5rem;
}
.post-content blockquote {
  border-left: 4px solid var(--gold);
  padding-left: 1rem;
  margin: 1.5rem 0;
  color: var(--text-3);
  font-style: italic;
}

/* ═══════ FOOTER ═══════ */
footer {
  background: var(--surface-2);
  border-top: 1px solid var(--border);
  padding: 3rem 2rem;
  text-align: center;
  color: var(--text-3);
}

@media (max-width: 768px) {
  .hero h1 { font-size: 2rem; }
  .blog-grid { grid-template-columns: 1fr; }
  .nav-links { gap: 1rem; font-size: 0.9rem; }
}
</style>
</head>
<body>

<!-- Navigation -->
<nav>
  <div class="nav-container">
    <a href="index.html" class="logo">KA</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="blogs.html">Blog</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </div>
</nav>

<!-- Hero Section -->
<div class="hero">
  <h1>Insights & Updates</h1>
  <p>Expert perspectives on tax regulations, compliance, and business strategy</p>
</div>

<!-- Blog Listing -->
<div class="container">
  <div id="blog-list" class="blog-grid"></div>
</div>

<!-- Footer -->
<footer>
  <p>&copy; 2026 Kamboh Associates. All rights reserved.</p>
</footer>

<script>
// Blog posts stored as JSON (add to blogs-data.js)
const blogPosts = [
  {
    id: 'tax-deductions-2026',
    title: 'Essential Tax Deductions for 2026',
    excerpt: 'Learn about the most valuable tax deductions available to Pakistani businesses this year.',
    category: 'Tax Planning',
    date: '2026-05-19',
    author: 'Kamboh Associates',
    readTime: '5 min read',
    icon: '📊'
  },
  {
    id: 'regulatory-compliance',
    title: 'New Regulatory Compliance Requirements',
    excerpt: 'Stay updated with the latest regulatory changes affecting your business operations.',
    category: 'Compliance',
    date: '2026-05-15',
    author: 'Kamboh Associates',
    readTime: '4 min read',
    icon: '⚖️'
  }
];

// Render blog list
function renderBlogList() {
  const blogList = document.getElementById('blog-list');
  blogList.innerHTML = blogPosts.map(post => `
    <div class="blog-card" onclick="window.location.href='blog/${post.id}.html'">
      <div class="blog-card-image">${post.icon}</div>
      <div class="blog-card-content">
        <span class="blog-category">${post.category}</span>
        <h3 class="blog-title">${post.title}</h3>
        <p class="blog-excerpt">${post.excerpt}</p>
        <div class="blog-meta">
          <span class="blog-date">
            <i class="far fa-calendar"></i>
            ${new Date(post.date).toLocaleDateString('en-US', {year: 'numeric', month: 'short', day: 'numeric'})}
          </span>
          <span class="read-time">
            <i class="far fa-clock"></i>
            ${post.readTime}
          </span>
        </div>
      </div>
    </div>
  `).join('');
}

renderBlogList();
</script>
</body>
</html>
